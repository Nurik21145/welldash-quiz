<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бесплатный разбор бизнеса — WELLDASH</title>
<meta name="description" content="Ответьте на 6 вопросов и узнайте, где в вашем маркетинге и продажах слепая зона. Бесплатный разбор в цифрах.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#0e0e0c;
    --surface:#171715;
    --surface-2:#1f1f1c;
    --line:#2c2b27;
    --ink:#f5f4ef;
    --ink-soft:#b9b6a8;
    --ink-faint:#7d7a6e;
    --accent:#f5a623;
    --accent-ink:#15140f;
    --danger:#ff6b5b;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
  body{min-height:100vh;min-height:100dvh}
  button,input,textarea{font:inherit;color:inherit}
  .app{max-width:520px;margin:0 auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;min-height:40px}
  .back{background:none;border:0;color:var(--ink-soft);font-size:14px;padding:8px 0;cursor:pointer}
  .back[hidden]{display:none}
  .progress{display:flex;gap:5px;margin:10px 0 26px}
  .progress i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .25s}
  .progress i.on{background:var(--accent)}
  .screen{flex:1;display:flex;flex-direction:column;animation:in .28s ease both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 14px}
  h1,h2{font-family:'Unbounded',sans-serif;font-weight:600;line-height:1.18;margin:0 0 14px;text-wrap:balance}
  h1,h2{overflow-wrap:break-word;hyphens:manual}
  h1{font-size:clamp(20px,6vw,27px)}
  h2{font-size:clamp(17px,5.2vw,21px)}
  .lead{color:var(--ink-soft);font-size:16px;margin:0 0 26px}
  .hint{color:var(--ink-faint);font-size:13.5px;margin:-6px 0 16px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;transition:border-color .15s,background .15s,transform .1s}
  .opt:hover{border-color:#4a4840}
  .opt:active{transform:scale(.99)}
  .opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-faint);display:grid;place-items:center}
  .opt.multi .mark{border-radius:6px}
  .opt.sel{border-color:var(--accent);background:#221d12}
  .opt.sel .mark{background:var(--accent);border-color:var(--accent)}
  .opt.sel .mark::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
  .btn{display:block;width:100%;padding:17px 20px;border:0;border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;cursor:pointer;transition:transform .1s,opacity .15s}
  .btn:active{transform:scale(.99)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .spacer{flex:1;min-height:20px}
  .foot{color:var(--ink-faint);font-size:13px;margin-top:14px;text-align:center}
  .people{display:flex;gap:10px;align-items:center;margin-top:22px;color:var(--ink-soft);font-size:14px}
  .people b{color:var(--ink);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* processing */
  .calc{margin:auto;text-align:center}
  .spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);margin:0 auto 20px;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .calc p{color:var(--ink-soft);margin:0}

  /* result */
  .score{display:flex;align-items:flex-end;gap:12px;margin:2px 0 6px}
  .score .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:64px;line-height:.9;color:var(--accent)}
  .score .of{font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--ink-faint);padding-bottom:6px}
  .bar{height:8px;background:var(--line);border-radius:4px;margin:12px 0 8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .9s ease}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:16px 0}
  .card .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}
  .card h3{margin:0 0 8px;font-size:18px;font-weight:600}
  .card p{margin:0;color:var(--ink-soft);font-size:15px}
  .get{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .get li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
  .get .n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent)}
  .get li.lock .t{filter:blur(4.5px);user-select:none}
  .get li.lock .n{color:var(--ink-faint)}
  .lockrow{display:flex;gap:8px;align-items:center;color:var(--ink-faint);font-size:13px;margin-top:12px}
  .form{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .field label{display:block;font-size:13.5px;color:var(--ink-soft);margin-bottom:6px}
  .field input,.field textarea{width:100%;padding:15px 16px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface);font-size:16px;outline:none}
  .field textarea{min-height:76px;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .field.err input{border-color:var(--danger)}
  .errmsg{color:var(--danger);font-size:13px;margin-top:5px;display:none}
  .field.err .errmsg{display:block}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:11px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:14.5px}
  .chip.sel{border-color:var(--accent);background:#221d12}
  .consent{display:flex;gap:10px;align-items:flex-start;color:var(--ink-faint);font-size:12.5px;cursor:pointer}
  .consent input{margin-top:2px;accent-color:var(--accent);width:18px;height:18px;flex:none}
  .done{text-align:left}
  .check{width:64px;height:64px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin:20px 0 22px}
  .check::after{content:"";width:24px;height:12px;border-left:5px solid var(--accent-ink);border-bottom:5px solid var(--accent-ink);transform:rotate(-45deg) translate(2px,-3px)}
  .steps{list-style:none;padding:0;margin:0 0 26px;display:flex;flex-direction:column;gap:12px}
  .steps li{display:flex;gap:12px;font-size:15.5px;color:var(--ink-soft)}
  .steps b{color:var(--ink);font-weight:600}
</style>

<body>
<div class="app">
  <div class="top">
    <span></span>
    <button class="back" id="back" hidden>← Назад</button>
  </div>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <main class="screen" id="screen" aria-live="polite"></main>
</div>

<script>
/* ================== НАСТРОЙКИ — заполните перед запуском ================== */
const CONFIG = {
  // Адрес веб-приложения Google Apps Script (см. apps_script.gs). Пусто = ответы никуда не отправляются.
  SHEETS_URL: "",
  // WhatsApp для кнопки после записи, только цифры с кодом страны, например 77011234567. Пусто = кнопки не будет.
  WHATSAPP: ""
};
/* ========================================================================== */

const QUESTIONS = [
  { id:"niche", title:"Чем занимается ваш бизнес?", type:"single",
    opts:["Фитнес, красота, медицина, услуги","Онлайн-школа, обучение, эксперт","Магазин, товары, e-commerce","Недвижимость, строительство, B2B","Другое"] },
  { id:"revenue", title:"Какая у вас выручка в месяц?", type:"single",
    opts:["10–20 млн ₸","20–30 млн ₸","30–50 млн ₸","Больше 50 млн ₸"] },
  { id:"sources", title:"Откуда сейчас приходят клиенты?", hint:"Можно выбрать несколько вариантов", type:"multi",
    opts:["Таргетированная реклама","Instagram или TikTok без рекламы","Сарафанное радио","2ГИС, Google, карты","Холодные продажи, обзвон","Точно не знаю"] },
  { id:"conv", title:"Знаете ли вы, какая доля заявок доходит до покупки?", type:"single",
    opts:["Да, по каждому каналу","Знаю только в целом","Не знаю"] },
  { id:"budget", title:"Сколько вы тратите на рекламу в месяц?", type:"single",
    opts:["Не вкладываю","До 300 тыс. ₸","300 тыс. – 1 млн ₸","Больше 1 млн ₸"] },
  { id:"pain", title:"Что беспокоит больше всего?", type:"single",
    opts:["Дорогие заявки","Мало заявок","Заявки есть, но не покупают","Низкий средний чек","Клиенты не возвращаются","Не понимаю, куда уходят деньги"] }
];

const ZONES = {
  "Дорогие заявки": ["Цена заявки","Вы платите за поток дороже, чем могли бы. Пока не видно цену заявки и клиента по каждому каналу, снижать её приходится наугад."],
  "Мало заявок": ["Поток заявок","Потока не хватает, но причина обычно не в бюджете. Важно понять, какой канал реально даёт заявки, а какой только съедает деньги."],
  "Заявки есть, но не покупают": ["Утечка в продажах","Деньги теряются не на рекламе, а между заявкой и оплатой. Каждая потерянная заявка уже оплачена вами один раз."],
  "Низкий средний чек": ["Средний чек","Вы уже получаете клиента, но забираете с него меньше, чем он готов оставить. Это самый быстрый рычаг роста выручки."],
  "Клиенты не возвращаются": ["Повторные продажи","Вы каждый раз покупаете клиента заново. Повторная продажа стоит в разы дешевле первой, и сейчас вы её недополучаете."],
  "Не понимаю, куда уходят деньги": ["Слепая зона в цифрах","Решения принимаются без цифр: непонятно, какое направление окупается, а какое нет. Это главный источник скрытых потерь."]
};

const state = { step:-1, answers:{}, sid:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2) };
const $screen = document.getElementById("screen");
const $progress = document.getElementById("progress");
const $back = document.getElementById("back");
const TOTAL = QUESTIONS.length;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setProgress(n){
  $progress.innerHTML = Array.from({length:TOTAL},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("");
  $progress.style.display = n<0 ? "none" : "flex";
}
function render(html){ $screen.style.animation="none"; $screen.offsetHeight; $screen.style.animation=""; $screen.innerHTML = html; window.scrollTo({top:0}); }

function utm(){
  const p = new URLSearchParams(location.search), o = {};
  ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","fbclid"].forEach(k=>{ if(p.get(k)) o[k]=p.get(k); });
  return o;
}
function track(name, custom){
  try{ if(typeof fbq==="function"){ custom ? fbq("trackCustom",name) : fbq("track",name); } }catch(e){}
}
function send(payload){
  if(!CONFIG.SHEETS_URL){ console.info("[quiz] SHEETS_URL не задан, данные не отправлены:", payload); return; }
  try{
    fetch(CONFIG.SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),keepalive:true});
  }catch(e){ console.warn(e); }
}

/* ---------- screens ---------- */
function intro(){
  state.step = -1; setProgress(-1); $back.hidden = true;
  render(`
    <p class="eyebrow">Бесплатный разбор бизнеса</p>
    <h1>Сколько вы недозарабатываете на маркетинге и продажах?</h1>
    <p class="lead">6 вопросов, меньше двух минут. Покажем, где у вас слепая зона в цифрах и что именно мы посчитаем на разборе.</p>
    <button class="btn" id="start">Пройти квиз</button>
  `);
  document.getElementById("start").onclick = () => { track("QuizStart", true); ask(0); };
}

function ask(i){
  state.step = i; setProgress(i); $back.hidden = false;
  const q = QUESTIONS[i], cur = state.answers[q.id];
  const sel = q.type==="multi" ? (Array.isArray(cur)?cur:[]) : cur;
  render(`
    <h2>${esc(q.title)}</h2>
    ${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ""}
    <div class="opts" role="${q.type==="multi"?"group":"radiogroup"}">
      ${q.opts.map((o,k)=>{
        const on = q.type==="multi" ? sel.includes(o) : sel===o;
        return `<button class="opt ${q.type==="multi"?"multi":""} ${on?"sel":""}" data-k="${k}" role="${q.type==="multi"?"checkbox":"radio"}" aria-checked="${on}"><span class="mark"></span><span>${esc(o)}</span></button>`;
      }).join("")}
    </div>
    <div class="spacer"></div>
    ${q.type==="multi" ? `<button class="btn" id="next" ${sel.length?"":"disabled"}>Далее</button>` : ""}
  `);
  const opts = [...$screen.querySelectorAll(".opt")];
  opts.forEach(btn => btn.onclick = () => {
    const val = q.opts[+btn.dataset.k];
    if(q.type==="single"){
      state.answers[q.id] = val;
      opts.forEach(b=>b.classList.remove("sel")); btn.classList.add("sel");
      setTimeout(()=> next(), 220);
    } else {
      let arr = Array.isArray(state.answers[q.id]) ? [...state.answers[q.id]] : [];
      const none = "Точно не знаю";
      if(arr.includes(val)) arr = arr.filter(x=>x!==val);
      else { arr = val===none ? [none] : [...arr.filter(x=>x!==none), val]; }
      state.answers[q.id] = arr;
      opts.forEach(b=>{ const on = arr.includes(q.opts[+b.dataset.k]); b.classList.toggle("sel",on); b.setAttribute("aria-checked",on); });
      document.getElementById("next").disabled = arr.length===0;
    }
  });
  const nx = document.getElementById("next"); if(nx) nx.onclick = next;
}
function next(){ if(state.step+1 < TOTAL) ask(state.step+1); else finishQuiz(); }

function score(a){
  const conv = {"Да, по каждому каналу":6,"Знаю только в целом":3,"Не знаю":0}[a.conv] ?? 0;
  const known = (a.sources||[]).includes("Точно не знаю") ? 0 : 2;
  const clear = a.pain === "Не понимаю, куда уходят деньги" ? 0 : 2;
  return Math.min(10, conv + known + clear);
}
function leadTemp(a){
  const rev = ["20–30 млн ₸","30–50 млн ₸","Больше 50 млн ₸"].includes(a.revenue);
  const bud = ["300 тыс. – 1 млн ₸","Больше 1 млн ₸"].includes(a.budget);
  if(rev && bud) return "горячий";
  if(rev || bud || a.budget==="До 300 тыс. ₸") return "тёплый";
  return "холодный";
}
function payloadBase(event){
  const a = state.answers;
  return { event, session_id:state.sid, ts:new Date().toISOString(), page:location.href.split("?")[0],
    index:score(a), zone:(ZONES[a.pain]||ZONES["Не понимаю, куда уходят деньги"])[0], lead_temp:leadTemp(a),
    niche:a.niche||"", revenue:a.revenue||"", sources:(a.sources||[]).join("; "), conv_known:a.conv||"",
    budget:a.budget||"", pain:a.pain||"", ...utm() };
}

function finishQuiz(){
  setProgress(TOTAL); $back.hidden = true;
  render(`<div class="calc"><div class="spin"></div><p>Считаем ваш результат…</p></div>`);
  send(payloadBase("answers"));
  track("QuizCompleted", true);
  setTimeout(result, 1600);
}

function result(){
  const a = state.answers, idx = score(a);
  const z = ZONES[a.pain] || ZONES["Не понимаю, куда уходят деньги"];
  const level = idx<=3 ? "Вы почти не видите, куда идут деньги" : idx<=6 ? "Часть цифр видна, но картина неполная" : "База есть, но остаются скрытые потери";
  render(`
    <p class="eyebrow">Ваш результат</p>
    <div class="score"><span class="num">${idx}</span><span class="of">/ 10</span></div>
    <div class="bar"><i style="width:0%" id="barfill"></i></div>
    <p class="hint" style="margin:0 0 4px">Индекс прозрачности цифр. ${esc(level)}.</p>

    <div class="card">
      <p class="lbl">Главная зона внимания</p>
      <h3>${esc(z[0])}</h3>
      <p>${esc(z[1])}</p>
    </div>

    <div class="card">
      <p class="lbl">Что вы получите на бесплатном разборе, 60 минут</p>
      <ul class="get">
        <li><span class="n">1</span><span class="t">Реальную цену заявки и клиента по вашим каналам</span></li>
        <li><span class="n">2</span><span class="t">Карту потерь: на каком шаге от трафика до повторной продажи уходят деньги</span></li>
        <li><span class="n">3</span><span class="t">Сумму недополученной прибыли в тенге по каждому рычагу</span></li>
        <li><span class="n">4</span><span class="t">Приоритет №1: с чего начать, чтобы вернуть деньги быстрее всего</span></li>
      </ul>
    </div>

    <h2 style="margin-top:26px">Запишитесь на разбор</h2>
    <p class="hint">Оставьте контакты: мы напишем вам в WhatsApp и согласуем время.</p>
    <form class="form" id="lead" novalidate>
      <div class="field" id="f-name"><label for="name">Как к вам обращаться</label><input id="name" autocomplete="name" placeholder="Имя"><div class="errmsg">Укажите имя</div></div>
      <div class="field" id="f-phone"><label for="phone">Номер WhatsApp</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 ___ ___ __ __"><div class="errmsg">Укажите номер полностью</div></div>
      <div class="field"><label for="ig">Instagram или сайт бизнеса (по желанию)</label><input id="ig" placeholder="@name или ссылка"></div>
      <label class="consent"><input type="checkbox" id="agree" checked><span>Согласен(на) на обработку персональных данных для записи на разбор. Данные не передаются третьим лицам.</span></label>
      <button class="btn" type="submit" id="send">Записаться на бесплатный разбор</button>
    </form>
  `);
  requestAnimationFrame(()=>{ const b=document.getElementById("barfill"); if(b) b.style.width = (idx*10)+"%"; });
  document.getElementById("lead").onsubmit = (e)=>{
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const digits = phone.replace(/\D/g,"");
    let ok = true;
    document.getElementById("f-name").classList.toggle("err", !name); if(!name) ok=false;
    document.getElementById("f-phone").classList.toggle("err", digits.length<10); if(digits.length<10) ok=false;
    if(!document.getElementById("agree").checked){ ok=false; document.getElementById("agree").focus(); }
    if(!ok) return;
    const lead = { ...payloadBase("lead"), name, phone, instagram:document.getElementById("ig").value.trim() };
    document.getElementById("send").disabled = true;
    send(lead);
    track("Lead");
    thanks(lead);
  };
}

function thanks(lead){
  setProgress(-1); $back.hidden = true;
  const msg = encodeURIComponent(`Здравствуйте! Я ${lead.name}, прошёл(ла) квиз WELLDASH. Индекс ${lead.index}/10, зона внимания: ${lead.zone}. Хочу записаться на бесплатный разбор.`);
  render(`
    <div class="done">
      <div class="check"></div>
      <h1>Вы записаны на разбор</h1>
      <p class="lead">Мы свяжемся с вами по указанному номеру в рабочее время и согласуем удобное время разбора.</p>
      ${CONFIG.WHATSAPP ? `<a class="btn" style="text-align:center;text-decoration:none" href="https://wa.me/${CONFIG.WHATSAPP}?text=${msg}">Написать нам в WhatsApp</a>` : ""}
    </div>
  `);
}

$back.onclick = () => { if(state.step>0) ask(state.step-1); else intro(); };
intro();
</script>
</body>
</html>
